name: Retrain and Deploy Model

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight

jobs:
  retrain-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Retrain model
        run: |
          python retrain_model.py  # Retrain model with new data

      - name: Save the updated model
        run: |
          mkdir -p models
          cp trained_model.pkl models/

      - name: Deploy to server
        run: |
          scp models/trained_model.pkl user@your-server:/path/to/deployment/
